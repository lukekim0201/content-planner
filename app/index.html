<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>API Warmup</title>
</head>
<body>
    <h2>Login Test</h2>
    <input id="email" placeholder="email" value="alice@example.com">
    <input id="password" type="password" placeholder="password" value="testpassword123">
    <button onclick="login()">Log In</button>
    <pre id="output"></pre>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const response = await fetch('http://localhost:8000/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });

            const data = await response.json();
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);

            if (response.ok) {
                localStorage.setItem('token', data.access_token);
            }
        }
    </script>

    <h2>Fetch My Projects</h2>
    <button onclick="getProjects()">Get Projects</button>
    <pre id="projects-output"></pre>

    <script>
    async function getProjects() {
        const token = localStorage.getItem('token');
        const response = await fetch('http://localhost:8000/projects/', {
        headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        document.getElementById('projects-output').textContent = JSON.stringify(data, null, 2);
    }
    </script>
</body>
</html>
